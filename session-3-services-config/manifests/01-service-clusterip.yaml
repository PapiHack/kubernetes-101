apiVersion: v1
kind: Service
metadata:
  name: hello-svc
spec:
  type: ClusterIP
  selector:
    app: hello
  ports:
    - port: 80
      # hello-deploy runs the Session 1 Flask app, which listens on 5000.
      # The Service's own port stays 80, so http://hello-svc needs no port.
      targetPort: 5000
